[workspace]
resolver = "2"
members = ["core", "scorer", "daemon", "tui", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["schausberger"]
license = "MIT"
repository = "https://github.com/schausberger/vitals"

[workspace.dependencies]
# Shared dependencies across workspace
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.132"
time = { version = "0.3.36", features = [
  "serde",
  "serde-well-known",
  "formatting",
  "parsing",
  "macros",
] }
scorer = { path = "scorer" }
thiserror = "1.0.69"
anyhow = { version = "1.0.92", features = ["backtrace"] }
tokio = { version = "1.41", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
clap = { version = "4.5.23", features = ["derive"] }
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
