builds:
  include:
    # Rust packages (daemon and tui binaries)
    - packages.x86_64-linux.daemon
    - packages.x86_64-linux.tui
    - packages.x86_64-linux.default
    - packages.x86_64-linux.systemd-service
    # Multi-architecture support
    - packages.aarch64-linux.daemon
    - packages.aarch64-linux.tui
    - packages.aarch64-linux.default
  exclude:
    # Development shells are not buildable as derivations
    - devShells.*
