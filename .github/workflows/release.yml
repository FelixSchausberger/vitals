name: Publish Crates
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (package only, no upload)"
        type: boolean
        default: true
permissions:
  contents: read
env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://felixschausberger.cachix.org
    extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= felixschausberger.cachix.org-1:vCZvKWZ13V7CxC7HjRPqZJTwcKLJaaxYnfQsUIkDFaE=
jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            ${{ env.NIX_CONFIG }}
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3
      # Publish order matters: dependencies must land on crates.io first.
      - name: Package all crates (dry run)
        if: inputs.dry_run
        run: |
          for crate in vitals-core scorer vitals-daemon vitals-tui vitals-cli; do
            echo "=== packaging $crate ==="
            nix develop --command cargo package -p "$crate" --no-verify --allow-dirty
          done
      - name: Publish in dependency order
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in vitals-core scorer vitals-daemon vitals-tui vitals-cli; do
            echo "=== publishing $crate ==="
            nix develop --command \
              cargo publish -p "$crate" --no-verify --token "$CARGO_REGISTRY_TOKEN"
            sleep 15  # allow crates.io index to propagate to dependents
          done
