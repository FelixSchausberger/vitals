name: Build and Push to Cachix
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cachix-push-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://felixschausberger.cachix.org
    extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= felixschausberger.cachix.org-1:vCZvKWZ13V7CxC7HjRPqZJTwcKLJaaxYnfQsUIkDFaE=
    max-jobs = auto
    cores = 0
jobs:
  build-and-push:
    name: Build and push packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            ${{ env.NIX_CONFIG }}
      - name: Install Cachix
        uses: cachix/cachix-action@v17
        with:
          name: felixschausberger
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build default package
        run: nix build .#default --print-out-paths
      - name: Build daemon
        run: nix build .#daemon --print-out-paths
      - name: Build TUI
        run: nix build .#tui --print-out-paths
      - name: Build CLI
        run: nix build .#cli --print-out-paths
