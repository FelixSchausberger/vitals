name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write
env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    allow-import-from-derivation = true
    accept-flake-config = true
    extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://felixschausberger.cachix.org
    extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= felixschausberger.cachix.org-1:vCZvKWZ13V7CxC7HjRPqZJTwcKLJaaxYnfQsUIkDFaE=
    max-jobs = auto
    cores = 0
    builders-use-substitutes = true
jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        if: github.token != ''
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event_name != 'pull_request' && github.token != ''
        with:
          sarif_file: "trivy-results.sarif"
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            ${{ env.NIX_CONFIG }}
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Run cargo audit
        run: |
          nix develop --command cargo audit --deny warnings
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            ${{ env.NIX_CONFIG }}
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Validate workspace structure
        run: |
          echo "=== Validating Cargo Workspace ==="
          for member in core scorer daemon tui cli; do
            if [ -f "$member/Cargo.toml" ]; then
              echo "✅ Workspace member '$member' found"
            else
              echo "❌ Workspace member '$member/Cargo.toml' missing"
              exit 1
            fi
          done
          echo "✅ Workspace structure is valid"
      - name: Validate flake
        run: |
          nix flake metadata
          nix flake show
          echo "✅ Flake structure is valid"
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            ${{ env.NIX_CONFIG }}
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Format check
        run: |
          nix develop --command cargo fmt --all --check
          echo "✅ Code is properly formatted"
      - name: Clippy check
        run: |
          nix develop --command cargo clippy --workspace --all-targets -- -D warnings
          echo "✅ Clippy checks passed"
      - name: Clippy check (no systemd feature)
        run: |
          nix develop --command cargo clippy -p vitals-daemon --no-default-features --all-targets -- -D warnings
          echo "✅ Clippy checks passed without systemd"
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [validate, quality]
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            ${{ env.NIX_CONFIG }}
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Run workspace tests
        run: |
          nix develop --command cargo nextest run --workspace
          echo "✅ All tests passed"
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [validate, quality, test]
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            ${{ env.NIX_CONFIG }}
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Build workspace packages
        run: |
          echo "=== Building Nix packages ==="
          nix build .#default --print-out-paths
          nix build .#daemon --print-out-paths
          nix build .#tui --print-out-paths
          nix build .#cli --print-out-paths
          echo "✅ All packages built successfully"
