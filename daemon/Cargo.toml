[package]
name = "vitals-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "Lightweight system health monitoring daemon with journald and systemd integration"
keywords = ["daemon", "monitoring", "systemd", "journald", "health"]
categories = ["command-line-utilities"]

[[bin]]
name = "vitals-daemon"
path = "src/bin/daemon.rs"

[features]
default = ["systemd"]
# journald + systemd D-Bus integration; disable for non-systemd systems
systemd = ["dep:zbus", "dep:systemd"]

[dependencies]
# Shared core models
vitals-core = { path = "../core", version = "0.1.0" }

# Scorer algorithm
scorer.workspace = true

# Async runtime
tokio = { workspace = true, features = ["signal"] }
tokio-stream = "0.1.17"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI parsing
clap = { workspace = true, features = ["env", "color"] }

# Time handling
time.workspace = true

# Regular expressions for issue matching
regex = "1.10"

# System integration
zbus = { version = "5.1", optional = true }
systemd = { version = "0.10", default-features = false, features = [
  "journal",
], optional = true }
procfs = "0.17"
num_cpus = "1.16"
nix = { version = "0.29", default-features = false, features = ["fs"] }

# Web server for daemon HTTP API
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }

# HTTP for Unix socket serving
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true

# Configuration
toml = { version = "0.8", features = ["preserve_order"] }
dirs = "5.0"

[dev-dependencies]
tokio-test = "0.4.4"
tempfile = "3.0"

[lints]
workspace = true
